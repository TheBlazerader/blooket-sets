name: Remote File Pull
on:
  workflow_dispatch: # Allows you to trigger this manually with a button

jobs:
  download-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Pull Large HTML File
        run: |
          curl -L "https://we.tl/t-V1qh7hh7sePoEVLE" -o index.html

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "Add large 71MB HTML file via automated Action"
          git push
