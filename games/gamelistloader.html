
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Library</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #202020;
  display: flex;
  align-items: center;
  gap: 15px;
}

h1 { margin: 0; font-size: 23px; }

#count {
  color: #aaa;
  margin-left: auto;
}

#search {
  display: block;
  width: calc(100% - 32px);
  margin: 16px;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
}

#games {
  padding: 0 16px 20px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px;
}

.game {
  background: #252525;
  border: 1px solid #383838;
  color: white;
  padding: 16px;
  border-radius: 8px;
  cursor: pointer;
  text-align: left;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.game:hover {
  background: #383838;
}

#status {
  padding: 20px;
  color: #aaa;
}

#player {
  display: none;
  position: fixed;
  inset: 0;
  background: #111;
  z-index: 5;
}

#gameFrame {
  width: 100%;
  height: calc(100% - 52px);
  border: 0;
  background: white;
}

#back {
  height: 52px;
  width: 100%;
  border: 0;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>
</head>
<body>

<header>
  <h1>Game Library</h1>
  <span id="count">Loading...</span>
</header>

<input id="search" placeholder="Search games...">

<div id="status">Loading games from Google Drive...</div>
<div id="games"></div>

<div id="player">
  <button id="back">← Back to Game Library</button>
  <iframe id="gameFrame" allow="fullscreen; pointer-lock"></iframe>
</div>

<script>
const WORKER = "https://drive-html-loader.pfeiferblaise.workers.dev/";

let games = [];

const gamesElement = document.getElementById("games");
const searchElement = document.getElementById("search");
const statusElement = document.getElementById("status");
const countElement = document.getElementById("count");
const player = document.getElementById("player");
const frame = document.getElementById("gameFrame");

async function loadLibrary() {
  try {
    const response = await fetch(WORKER);

    if (!response.ok) {
      throw new Error("Could not retrieve game list.");
    }

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.error || "Library loading failed.");
    }

    games = data.files;

    countElement.textContent = games.length + " games";
    statusElement.textContent = "";
    renderGames();

  } catch (error) {
    statusElement.textContent =
      "Unable to load library: " + error.message;
  }
}

function renderGames() {
  const query = searchElement.value.toLowerCase();

  const filtered = games.filter(game =>
    game.name.toLowerCase().includes(query)
  );

  gamesElement.innerHTML = "";

  if (!filtered.length) {
    statusElement.textContent = "No matching games found.";
    return;
  }

  statusElement.textContent = "";

  for (const game of filtered) {
    const button = document.createElement("button");
    button.className = "game";
    button.textContent =
      game.name.replace(/\.html$/i, "");

    button.onclick = () => openGame(game);

    gamesElement.appendChild(button);
  }
}

function openGame(game) {
  player.style.display = "block";

  frame.src =
    WORKER + "?action=file&id=" +
    encodeURIComponent(game.id);
}

function closeGame() {
  frame.src = "about:blank";
  player.style.display = "none";
}

searchElement.addEventListener("input", renderGames);
document.getElementById("back").onclick = closeGame;

loadLibrary();
</script>

</body>
</html>
