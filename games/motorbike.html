
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motorcycle Stunt Sandbox</title>

<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial}
canvas{display:block}
#hud{
 position:fixed;right:16px;top:16px;color:white;
 background:#0009;padding:15px;border-radius:12px;
 line-height:1.7;pointer-events:none
}
#hud strong{font-size:26px;color:#ffe066}
#controls{
 position:fixed;bottom:15px;left:15px;
 background:#0008;color:white;padding:12px;
 border-radius:10px;line-height:1.6
}
#status{
 position:fixed;top:50%;left:50%;
 transform:translate(-50%,-50%);
 background:#111;color:white;padding:24px;
 border-radius:10px;z-index:5;text-align:center;
 max-width:90vw;white-space:pre-wrap;
}
</style>
</head>

<body>

<div id="hud">
<b>MOTORCYCLE STUNT SANDBOX</b><br>
Score: <strong id="score">0</strong><br>
Air Time: <span id="air">0.0</span>s<br>
Speed: <span id="speed">0</span> km/h
</div>

<div id="controls">
W / ↑ — Accelerate<br>
S / ↓ — Reverse<br>
A / ← — Rotate Left<br>
D / → — Rotate Right<br>
SPACE — Jump<br>
R — Reset
</div>

<div id="status">Loading game engine...</div>

<script type="module">
const status=document.getElementById("status");

function showError(message){
 status.style.display="block";
 status.style.background="#651b1b";
 status.textContent="GAME LOADING ERROR\n\n"+message+
 "\n\nCheck your internet connection and reload.";
}

try{

/* =====================================================
   LOAD LIBRARIES
===================================================== */

status.textContent="Loading Three.js...";

const THREE=await import(
 "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
);

status.textContent="Loading Rapier physics...";

const RAPIER=await import(
 "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/+esm"
);

status.textContent="Initializing Rapier physics...";

await RAPIER.init();

/* =====================================================
   SCENE
===================================================== */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,150,700);

const camera=new THREE.PerspectiveCamera(
 70,innerWidth/innerHeight,.1,1200
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x71805c,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(80,120,50);
sun.castShadow=true;
scene.add(sun);

/* =====================================================
   RAPIER WORLD
===================================================== */

const world=new RAPIER.World({
 x:0,
 y:-9.81,
 z:0
});

world.timestep=1/120;

/* =====================================================
   GROUND
===================================================== */

const ground=new THREE.Mesh(
 new THREE.BoxGeometry(2000,2,2000),
 new THREE.MeshStandardMaterial({color:0x765432})
);

ground.position.y=-1;
ground.receiveShadow=true;
scene.add(ground);

const groundBody=world.createRigidBody(
 RAPIER.RigidBodyDesc.fixed()
  .setTranslation(0,-1,0)
);

world.createCollider(
 RAPIER.ColliderDesc.cuboid(1000,1,1000)
  .setFriction(1.2),
 groundBody
);

/* =====================================================
   RAMPS
===================================================== */

const rampData=[];

function makeRamp(startX,z,length,angle){
 const width=12;
 const rise=length*Math.tan(angle);

 // Visual ramp geometry
 const shape=new THREE.Shape();
 shape.moveTo(0,0);
 shape.lineTo(length,rise);
 shape.lineTo(length,0);
 shape.closePath();

 const geometry=new THREE.ExtrudeGeometry(shape,{
  depth:width,
  bevelEnabled:false
 });

 geometry.translate(0,0,-width/2);
 geometry.computeVertexNormals();

 const mesh=new THREE.Mesh(
  geometry,
  new THREE.MeshStandardMaterial({
   color:0x99704b,
   roughness:.95,
   side:THREE.DoubleSide
  })
 );

 mesh.position.set(startX,0,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 scene.add(mesh);

 // ================================================
 // RAPier collider FIX:
 // Use convexHull instead of geometry.index.array
 // ================================================

 const positions=geometry.attributes.position.array;

 const rampBody=world.createRigidBody(
  RAPIER.RigidBodyDesc.fixed()
   .setTranslation(startX,0,z)
 );

 const hull=RAPIER.ColliderDesc.convexHull(
  new Float32Array(positions)
 );

 if(!hull){
  throw new Error(
   "Failed to create ramp collider at X="+startX
  );
 }

 hull.setFriction(1.2);

 world.createCollider(hull,rampBody);

 // Store ramp information
 rampData.push({
  startX,
  endX:startX+length,
  zMin:z-width/2,
  zMax:z+width/2,
  angle,
  rise,
  length
 });
}

// Main stunt course
makeRamp(18,0,24,.25);
makeRamp(52,0,30,.30);
makeRamp(95,0,36,.32);
makeRamp(145,0,32,.28);
makeRamp(190,0,40,.35);
makeRamp(250,0,45,.38);
makeRamp(320,0,36,.28);

// Alternate ramps
makeRamp(80,25,30,.30);
makeRamp(180,-25,40,.35);
makeRamp(275,25,45,.38);

/* =====================================================
   MOTORCYCLE VISUAL
===================================================== */

const bike=new THREE.Group();
scene.add(bike);

const red=new THREE.MeshStandardMaterial({
 color:0xe52b20,roughness:.4
});

const black=new THREE.MeshStandardMaterial({
 color:0x151515,roughness:.7
});

const metal=new THREE.MeshStandardMaterial({
 color:0xaaaaaa,metalness:.7
});

const blue=new THREE.MeshStandardMaterial({
 color:0x202d45
});

const yellow=new THREE.MeshStandardMaterial({
 color:0xffcc22
});

function box(parent,material,x,y,z,sx,sy,sz){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(sx,sy,sz),
  material
 );

 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

// Bike frame
box(bike,red,0,0,0,1.45,.28,.38);
box(bike,red,.25,.25,0,.65,.32,.4);
box(bike,black,-.35,.18,0,.5,.2,.35);
box(bike,metal,0,-.1,0,.12,.5,.12);

// Wheels
const wheelGroups=[];

const tireGeometry=new THREE.CylinderGeometry(
 .48,.48,.16,32
);

const hubGeometry=new THREE.CylinderGeometry(
 .13,.13,.19,16
);

for(const x of [-1.05,1.05]){
 const wheelGroup=new THREE.Group();
 wheelGroup.position.set(x,-.45,0);

 const tire=new THREE.Mesh(tireGeometry,black);
 tire.rotation.x=Math.PI/2;
 tire.castShadow=true;
 wheelGroup.add(tire);

 const hub=new THREE.Mesh(hubGeometry,metal);
 hub.rotation.x=Math.PI/2;
 wheelGroup.add(hub);

 for(const side of [-1,1]){
  const ring=new THREE.Mesh(
   new THREE.TorusGeometry(.39,.025,8,24),
   metal
  );

  ring.position.z=side*.09;
  wheelGroup.add(ring);
 }

 bike.add(wheelGroup);
 wheelGroups.push(wheelGroup);
}

// Fork and handlebars
box(bike,metal,.85,-.05,0,.12,.65,.12);
box(bike,metal,.85,.35,0,.45,.08,.08);
box(bike,black,.85,.35,0,.08,.12,.45);

// Rider
const rider=new THREE.Group();
rider.position.set(-.05,.55,0);
bike.add(rider);

const torso=new THREE.Mesh(
 new THREE.CapsuleGeometry(.22,.5,4,8),
 blue
);

torso.rotation.z=-.45;
torso.position.set(0,.25,0);
rider.add(torso);

const helmet=new THREE.Mesh(
 new THREE.SphereGeometry(.21,20,16),
 yellow
);

helmet.position.set(.2,.62,0);
rider.add(helmet);

// Arms and legs
box(rider,blue,.28,.32,.18,.42,.1,.1);
box(rider,blue,.28,.32,-.18,.42,.1,.1);
box(rider,blue,-.15,-.1,.15,.4,.14,.12);
box(rider,blue,-.15,-.1,-.15,.4,.14,.12);

/* =====================================================
   MOTORCYCLE RIGID BODY
===================================================== */

const body=world.createRigidBody(
 RAPIER.RigidBodyDesc.dynamic()
  .setTranslation(0,.95,0)
  .setLinearDamping(.15)
  .setAngularDamping(5)
  .setCanSleep(false)
);

// Main motorcycle collider
world.createCollider(
 RAPIER.ColliderDesc.cuboid(.8,.45,.3)
  .setTranslation(0,-.45,0)
  .setFriction(1.3),
 body
);

/* =====================================================
   CONTROLS
===================================================== */

const keys={};
let jumpPressed=false;

addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="Space"){
  e.preventDefault();
  if(!e.repeat)jumpPressed=true;
 }

 if([
  "ArrowUp","ArrowDown","ArrowLeft","ArrowRight"
 ].includes(e.code)){
  e.preventDefault();
 }

 if(e.code==="KeyR")reset();
});

addEventListener("keyup",e=>{
 keys[e.code]=false;
});

/* =====================================================
   CONTROLLER
===================================================== */

let heading=0;
let pitch=0;
let roll=0;
let speed=0;
let grounded=false;
let jumpCooldown=0;

let score=0;
let airtime=0;
let scoreTimer=0;

const UP=new THREE.Vector3(0,1,0);
const yawQ=new THREE.Quaternion();
const pitchQ=new THREE.Quaternion();
const rollQ=new THREE.Quaternion();
const combinedQ=new THREE.Quaternion();

function applyBikeRotation(){
 yawQ.setFromAxisAngle(UP,heading);

 pitchQ.setFromAxisAngle(
  new THREE.Vector3(0,0,1),pitch
 );

 rollQ.setFromAxisAngle(
  new THREE.Vector3(1,0,0),roll
 );

 combinedQ.copy(yawQ).multiply(pitchQ).multiply(rollQ);

 body.setRotation({
  x:combinedQ.x,
  y:combinedQ.y,
  z:combinedQ.z,
  w:combinedQ.w
 },true);
}

/* =====================================================
   RAMP HEIGHT
===================================================== */

function getGroundHeight(x,z){
 let height=0;

 for(const r of rampData){
  if(
   x>=r.startX &&
   x<=r.endX &&
   z>=r.zMin &&
   z<=r.zMax
  ){
   const surface=(x-r.startX)*Math.tan(r.angle);
   height=Math.max(height,surface);
  }
 }

 return height;
}

function checkGround(){
 const p=body.translation();
 const v=body.linvel();
 const surface=getGroundHeight(p.x,p.z);

 grounded=
  p.y<=surface+1.08 &&
  v.y<=1.5;

 return grounded;
}

/* =====================================================
   RESET
===================================================== */

function reset(){
 body.setTranslation({x:0,y:.95,z:0},true);
 body.setLinvel({x:0,y:0,z:0},true);
 body.setAngvel({x:0,y:0,z:0},true);
 body.resetForces(true);
 body.resetTorques(true);

 heading=0;
 pitch=0;
 roll=0;
 speed=0;

 grounded=false;
 jumpCooldown=0;

 applyBikeRotation();

 score=0;
 airtime=0;
 scoreTimer=0;

 document.getElementById("score").textContent="0";
}

/* =====================================================
   PHYSICS CONTROLLER
===================================================== */

function controller(dt){
 const p=body.translation();
 const v=body.linvel();

 checkGround();

 const accelerating=keys.KeyW||keys.ArrowUp;
 const reversing=keys.KeyS||keys.ArrowDown;

 const steerRight=keys.KeyD||keys.ArrowRight;
 const steerLeft=keys.KeyA||keys.ArrowLeft;

 // Speed control
 if(accelerating)speed+=26*dt;
 else if(reversing)speed-=18*dt;
 else speed*=Math.pow(.985,dt*60);

 speed=Math.max(-12,Math.min(42,speed));

 // Ground steering / airborne rotation
 if(grounded){
  const steer=(steerRight?1:0)-(steerLeft?1:0);

  heading-=steer*1.7*dt*Math.min(1,Math.abs(speed)/5);
  pitch=0;
  roll=-steer*.16;
 }else{
  pitch+=(steerRight?1:0)*2.8*dt;
  pitch-=(steerLeft?1:0)*2.8*dt;
  roll=0;
 }

 // Preserve vertical velocity except when jumping
 let verticalVelocity=v.y;

 if(jumpPressed && grounded && jumpCooldown<=0){
  verticalVelocity=8.5;
  grounded=false;
  jumpCooldown=.30;
 }

 jumpPressed=false;
 jumpCooldown=Math.max(0,jumpCooldown-dt);

 // Forward movement
 const forwardX=Math.cos(heading);
 const forwardZ=-Math.sin(heading);

 body.setLinvel({
  x:forwardX*speed,
  y:verticalVelocity,
  z:forwardZ*speed
 },true);

 applyBikeRotation();
}

/* =====================================================
   CAMERA
===================================================== */

const cameraDesired=new THREE.Vector3();
const cameraLook=new THREE.Vector3();

function updateCamera(dt){
 const p=body.translation();

 cameraDesired.set(
  p.x-Math.cos(heading)*10,
  p.y+4.5,
  p.z+Math.sin(heading)*10
 );

 camera.position.lerp(
  cameraDesired,
  1-Math.exp(-5*dt)
 );

 cameraLook.set(p.x,p.y+1,p.z);
 camera.lookAt(cameraLook);
}

/* =====================================================
   VISUAL SYNC
===================================================== */

function syncBike(dt){
 const p=body.translation();
 const q=body.rotation();

 bike.position.set(p.x,p.y,p.z);
 bike.quaternion.set(q.x,q.y,q.z,q.w);

 const wheelSpin=speed*dt/.48;

 for(const wheel of wheelGroups){
  wheel.rotation.z-=wheelSpin;
 }
}

/* =====================================================
   GAME LOOP
===================================================== */

const clock=new THREE.Clock();
let accumulator=0;

function animate(){
 requestAnimationFrame(animate);

 const frameDt=Math.min(clock.getDelta(),.05);
 accumulator+=frameDt;

 // Fixed-step Rapier simulation
 while(accumulator>=1/120){
  controller(1/120);
  world.step();
  accumulator-=1/120;
 }

 const v=body.linvel();

 if(!grounded){
  airtime+=frameDt;
  scoreTimer+=frameDt;

  while(scoreTimer>=.1){
   score++;
   scoreTimer-=.1;
  }
 }else{
  airtime=0;
  scoreTimer=0;
 }

 document.getElementById("score").textContent=score;
 document.getElementById("air").textContent=airtime.toFixed(1);

 document.getElementById("speed").textContent=
  Math.round(Math.sqrt(v.x*v.x+v.z*v.z)*3.6);

 syncBike(frameDt);
 updateCamera(frameDt);
 renderer.render(scene,camera);
}

/* =====================================================
   RESIZE
===================================================== */

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

/* =====================================================
   START
===================================================== */

reset();

status.textContent="Starting game...";
animate();

status.style.display="none";

}catch(error){
 console.error("Motorcycle Sandbox initialization error:",error);
 showError(error?.stack||error?.message||String(error));
}
</script>

</body>
</html>
