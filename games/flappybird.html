<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Bird</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #222;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
#game {
    position: relative;
    width: min(100vw, 400px);
    height: min(100vh, 600px);
    overflow: hidden;
    background: #70c5ce;
    border: 4px solid #333;
}
canvas {
    display: block;
    width: 100%;
    height: 100%;
}
#overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
    text-shadow: 2px 3px #444;
    pointer-events: none;
}
#title {
    font-size: 42px;
    font-weight: 900;
    color: #ffdf37;
    margin-bottom: 12px;
}
#message {
    font-size: 21px;
    line-height: 1.7;
}
#restart {
    display: none;
    pointer-events: auto;
    margin-top: 20px;
    padding: 12px 24px;
    border: 3px solid #9b651b;
    border-radius: 8px;
    background: #ffdf37;
    color: #333;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
#score {
    position: absolute;
    top: 18px;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 46px;
    font-weight: bold;
    text-shadow: 3px 3px #444;
    pointer-events: none;
}
</style>
</head>
<body>
<div id="game">
    <canvas id="canvas" width="400" height="600"></canvas>
    <div id="score">0</div>
    <div id="overlay">
        <div id="title">FLAPPY BIRD</div>
        <div id="message">Click or press SPACE<br>to flap your wings!</div>
        <button id="restart">PLAY AGAIN</button>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const overlay = document.getElementById("overlay");
const titleEl = document.getElementById("title");
const messageEl = document.getElementById("message");
const restartBtn = document.getElementById("restart");

const W = 400;
const H = 600;
const groundH = 65;

let bird, pipes, score, frame, state, groundOffset;

function reset() {
    bird = {
        x: 90,
        y: 260,
        vy: 0,
        radius: 15,
        rotation: 0
    };
    pipes = [];
    score = 0;
    frame = 0;
    groundOffset = 0;
    state = "ready";
    scoreEl.textContent = "0";
    overlay.style.display = "flex";
    titleEl.textContent = "FLAPPY BIRD";
    messageEl.innerHTML = "Click or press SPACE<br>to flap your wings!";
    restartBtn.style.display = "none";
}

function flap() {
    if (state === "over") return;
    if (state === "ready") {
        state = "playing";
        overlay.style.display = "none";
    }
    bird.vy = -7.2;
}

function endGame() {
    if (state !== "playing") return;
    state = "over";
    overlay.style.display = "flex";
    titleEl.textContent = "GAME OVER";
    messageEl.innerHTML = "Score: " + score + "<br>Try again!";
    restartBtn.style.display = "block";
}

function addPipe() {
    const gap = Math.max(130, 165 - score * 1.2);
    const margin = 65;
    const gapY = margin + Math.random() * (H - groundH - gap - margin * 2);

    pipes.push({
        x: W + 10,
        top: gapY,
        gap: gap,
        scored: false
    });
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#70c5ce");
    sky.addColorStop(1, "#b5edf2");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    for (let i = 0; i < 4; i++) {
        const x = ((i * 135 - frame * 0.35) % 500 + 500) % 500 - 50;
        const y = 70 + (i % 3) * 65;
        ctx.beginPath();
        ctx.arc(x, y, 22, 0, Math.PI * 2);
        ctx.arc(x + 25, y - 10, 29, 0, Math.PI * 2);
        ctx.arc(x + 52, y, 21, 0, Math.PI * 2);
        ctx.fill();
    }

    // Hills
    ctx.fillStyle = "#91d65a";
    ctx.beginPath();
    ctx.moveTo(0, H - groundH);
    for (let x = 0; x <= W; x += 20) {
        ctx.lineTo(x, 480 + Math.sin((x + frame * 0.4) / 55) * 16);
    }
    ctx.lineTo(W, H - groundH);
    ctx.fill();
}

function drawPipe(pipe) {
    const bottomY = pipe.top + pipe.gap;
    const bottomHeight = H - groundH - bottomY;

    // Pipe bodies
    ctx.fillStyle = "#58c832";
    ctx.strokeStyle = "#277b19";
    ctx.lineWidth = 3;

    ctx.fillRect(pipe.x, 0, 58, pipe.top - 20);
    ctx.strokeRect(pipe.x, -2, 58, pipe.top - 18);

    ctx.fillRect(pipe.x, bottomY + 20, 58, bottomHeight);
    ctx.strokeRect(pipe.x, bottomY + 20, 58, bottomHeight);

    // Pipe lips
    ctx.fillStyle = "#72e344";
    ctx.fillRect(pipe.x - 5, pipe.top - 22, 68, 22);
    ctx.strokeRect(pipe.x - 5, pipe.top - 22, 68, 22);

    ctx.fillRect(pipe.x - 5, bottomY, 68, 22);
    ctx.strokeRect(pipe.x - 5, bottomY, 68, 22);

    // Highlights
    ctx.fillStyle = "#a3f77b";
    ctx.fillRect(pipe.x + 7, 0, 8, Math.max(0, pipe.top - 23));
    ctx.fillRect(pipe.x + 7, bottomY + 23, 8, Math.max(0, bottomHeight - 23));
}

function drawGround() {
    const y = H - groundH;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, W, groundH);

    ctx.fillStyle = "#77c943";
    ctx.fillRect(0, y, W, 12);

    ctx.fillStyle = "#4aab35";
    ctx.fillRect(0, y, W, 5);

    ctx.fillStyle = "#c2b36c";
    for (let x = -40 + groundOffset; x < W; x += 40) {
        ctx.fillRect(x, y + 25, 20, 5);
        ctx.fillRect(x + 15, y + 45, 20, 5);
    }

    ctx.strokeStyle = "#a39b60";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, y + 12);
    ctx.lineTo(W, y + 12);
    ctx.stroke();
}

function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rotation);

    // Tail
    ctx.fillStyle = "#ed8b18";
    ctx.beginPath();
    ctx.moveTo(-12, 2);
    ctx.lineTo(-25, -5);
    ctx.lineTo(-22, 9);
    ctx.closePath();
    ctx.fill();

    // Body
    ctx.fillStyle = "#ffdf30";
    ctx.strokeStyle = "#c58a16";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Wing
    ctx.fillStyle = "#f5b927";
    ctx.beginPath();
    ctx.ellipse(-4, 4 + Math.sin(frame * 0.6) * 2, 9, 6, -0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eye
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(8, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(10, -6, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#ff7525";
    ctx.strokeStyle = "#b84914";
    ctx.beginPath();
    ctx.moveTo(13, 0);
    ctx.lineTo(25, 3);
    ctx.lineTo(13, 7);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function collision(pipe) {
    const r = bird.radius - 2;
    const left = bird.x - r;
    const right = bird.x + r;
    const top = bird.y - r;
    const bottom = bird.y + r;

    if (right > pipe.x - 5 && left < pipe.x + 63) {
        if (top < pipe.top || bottom > pipe.top + pipe.gap) {
            return true;
        }
    }
    return false;
}

function update() {
    frame++;

    if (state === "playing") {
        bird.vy += 0.38;
        bird.y += bird.vy;
        bird.rotation = Math.min(Math.PI / 3, Math.max(-0.5, bird.vy * 0.07));

        const speed = Math.min(4.8, 2.8 + score * 0.07);

        if (frame % 92 === 0) addPipe();

        pipes.forEach(pipe => {
            pipe.x -= speed;

            if (!pipe.scored && pipe.x + 58 < bird.x) {
                pipe.scored = true;
                score++;
                scoreEl.textContent = score;
            }

            if (collision(pipe)) endGame();
        });

        pipes = pipes.filter(pipe => pipe.x > -80);

        if (bird.y + bird.radius >= H - groundH || bird.y - bird.radius <= 0) {
            endGame();
        }

        groundOffset = (groundOffset - speed) % 40;
    } else if (state === "ready") {
        bird.y = 260 + Math.sin(frame * 0.07) * 7;
        bird.rotation = 0;
    }

    drawBackground();
    pipes.forEach(drawPipe);
    drawGround();
    drawBird();

    requestAnimationFrame(update);
}

canvas.addEventListener("click", flap);

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
    }
});

restartBtn.addEventListener("click", e => {
    e.stopPropagation();
    reset();
});

reset();
update();
</script>
</body>
</html>
